<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Dental Crown and Cap Fitting Diagram">
  <defs>
    <linearGradient id="bgCrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="12" fill="url(#bgCrown)"/>
  
  <!-- Gum line -->
  <path d="M40,190 Q120,205 200,195 T360,200 L360,285 L40,285 Z" fill="#FCE7F3"/>
  <path d="M40,190 Q120,205 200,195 T360,200" fill="none" stroke="#F472B6" stroke-width="2.5"/>
  
  <!-- Natural Tooth Roots anchored in bone -->
  <path d="M150,190 C140,210 135,245 145,265 C150,270 165,270 170,255 C180,215 190,210 200,210 C210,210 220,215 230,255 C235,270 250,270 255,265 C265,245 260,210 250,190 Z" 
        fill="#FFFFFF" stroke="#0B2545" stroke-width="3"/>
  
  <!-- Prepared Natural Tooth Core (Tapered Stump) -->
  <path d="M165,190 L172,135 C172,130 185,125 200,125 C215,125 228,130 228,135 L235,190 Z" 
        fill="#FDE68A" stroke="#D97706" stroke-width="2.5"/>
  <text x="75" y="150" font-family="sans-serif" font-size="11" font-weight="700" fill="#B45309">Prepared Tooth Core</text>
  <line x1="150" y1="148" x2="175" y2="148" stroke="#D97706" stroke-width="1.5" stroke-dasharray="3 2"/>

  <!-- Custom Zirconia / Ceramic Dental Crown (Hovering down to fit) -->
  <g transform="translate(0, -35)">
    <!-- Downward motion arrows -->
    <path d="M175,95 L175,115 M170,110 L175,118 L180,110" stroke="#FF7A00" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M225,95 L225,115 M220,110 L225,118 L230,110" stroke="#FF7A00" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Crown exterior -->
    <path d="M155,50 C155,30 175,20 200,20 C225,20 245,30 245,50 C248,70 245,95 242,100 C238,105 162,105 158,100 C155,95 152,70 155,50 Z" 
          fill="#FFFFFF" stroke="#0B2545" stroke-width="3"/>
    <!-- Aesthetic shine highlight -->
    <path d="M170,35 C180,30 195,30 200,32" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>
  
  <text x="255" y="50" font-family="sans-serif" font-size="11" font-weight="700" fill="#0B2545">Custom Zirconia Cap</text>
  <line x1="240" y1="50" x2="250" y2="50" stroke="#0B2545" stroke-width="1.5"/>

  <!-- Lower summary box -->
  <g transform="translate(90, 255)">
    <rect width="220" height="28" rx="6" fill="#0B2545"/>
    <text x="110" y="18" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Restores Full Chewing Power &amp; Aesthetics</text>
  </g>
</svg>
