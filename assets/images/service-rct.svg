<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Root Canal Treatment Diagram">
  <defs>
    <linearGradient id="bgRct" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="12" fill="url(#bgRct)"/>
  
  <!-- Gum Line -->
  <path d="M40,160 Q120,175 200,165 T360,170 L360,280 L40,280 Z" fill="#FCE7F3" opacity="0.7"/>
  <path d="M40,160 Q120,175 200,165 T360,170" fill="none" stroke="#F472B6" stroke-width="3"/>
  
  <!-- Tooth Outer Crown & Roots -->
  <path d="M140,70 C140,50 160,40 200,40 C240,40 260,50 260,70 C265,110 270,160 260,230 C255,255 240,255 235,230 C225,180 215,160 200,160 C185,160 175,180 165,230 C160,255 145,255 140,230 C130,160 135,110 140,70 Z" 
        fill="#FFFFFF" stroke="#0B2545" stroke-width="3.5"/>
  
  <!-- Inner Treated Pulp Chamber & Gutta-percha canals -->
  <path d="M175,90 C175,80 185,75 200,75 C215,75 225,80 225,90 C225,110 228,140 236,215 C238,225 232,225 230,215 C222,170 215,150 200,150 C185,150 178,170 170,215 C168,225 162,225 164,215 C172,140 175,110 175,90 Z" 
        fill="#FF7A00"/>
  
  <!-- Sealed Core / Access Cavity Filling -->
  <rect x="180" y="55" width="40" height="25" rx="4" fill="#38BDF8" stroke="#0284C7" stroke-width="1.5"/>
  
  <!-- Annotations / Badges -->
  <g transform="translate(250, 60)">
    <rect width="130" height="32" rx="6" fill="#0B2545"/>
    <text x="65" y="20" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">1. Infected Pulp Cleared</text>
  </g>
  <g transform="translate(250, 115)">
    <rect width="130" height="32" rx="6" fill="#FF7A00"/>
    <text x="65" y="20" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">2. Biocompatible Seal</text>
  </g>
  <g transform="translate(20, 75)">
    <rect width="115" height="32" rx="6" fill="#0369A1"/>
    <text x="57" y="20" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">3. Crown Protected</text>
  </g>
</svg>
