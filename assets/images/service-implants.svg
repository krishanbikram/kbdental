<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Dental Implant Components Diagram">
  <defs>
    <linearGradient id="bgImp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <linearGradient id="titanium" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="12" fill="url(#bgImp)"/>
  
  <!-- Jawbone section -->
  <path d="M40,150 Q120,165 200,155 T360,160 L360,280 L40,280 Z" fill="#FEF3C7" opacity="0.65"/>
  <path d="M40,135 Q120,150 200,140 T360,145 L360,160 L40,160 Z" fill="#FCE7F3"/>
  <text x="50" y="270" font-family="sans-serif" font-size="11" font-weight="600" fill="#92400E">Natural Jawbone Integration (Osseointegration)</text>
  
  <!-- Component 1: Custom Porcelain/Zirconia Crown -->
  <path d="M165,30 C165,20 180,15 200,15 C220,15 235,20 235,30 C242,55 242,85 235,100 C230,110 170,110 165,100 C158,85 158,55 165,30 Z" 
        fill="#FFFFFF" stroke="#0B2545" stroke-width="3"/>
  
  <!-- Component 2: Abutment Connector -->
  <path d="M182,100 L218,100 L212,130 L188,130 Z" fill="#FF7A00" stroke="#0B2545" stroke-width="2"/>
  
  <!-- Component 3: Titanium Screw Post Fixture -->
  <g transform="translate(185, 130)">
    <rect x="0" y="0" width="30" height="15" fill="url(#titanium)" stroke="#0B2545" stroke-width="2"/>
    <!-- Threaded ridges -->
    <path d="M0,15 L30,15 L30,23 L0,23 Z" fill="url(#titanium)" stroke="#0B2545" stroke-width="1.5"/>
    <path d="M0,25 L30,25 L30,35 L0,35 Z" fill="url(#titanium)" stroke="#0B2545" stroke-width="1.5"/>
    <path d="M0,37 L30,37 L30,50 L0,50 Z" fill="url(#titanium)" stroke="#0B2545" stroke-width="1.5"/>
    <path d="M0,52 L30,52 L30,67 L0,67 Z" fill="url(#titanium)" stroke="#0B2545" stroke-width="1.5"/>
    <path d="M2,69 L28,69 L20,95 L10,95 Z" fill="url(#titanium)" stroke="#0B2545" stroke-width="2"/>
  </g>
  
  <!-- Labels with Callout Lines -->
  <!-- Crown Label -->
  <line x1="242" y1="55" x2="280" y2="55" stroke="#0B2545" stroke-width="1.5"/>
  <rect x="280" y="40" width="105" height="28" rx="4" fill="#0B2545"/>
  <text x="332" y="58" fill="#FFFFFF" font-family="sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">1. Zirconia Crown</text>
  
  <!-- Abutment Label -->
  <line x1="218" y1="115" x2="280" y2="115" stroke="#FF7A00" stroke-width="1.5"/>
  <rect x="280" y="100" width="105" height="28" rx="4" fill="#FF7A00"/>
  <text x="332" y="118" fill="#FFFFFF" font-family="sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">2. Abutment Join</text>

  <!-- Fixture Label -->
  <line x1="216" y1="180" x2="280" y2="180" stroke="#475569" stroke-width="1.5"/>
  <rect x="280" y="165" width="105" height="28" rx="4" fill="#334155"/>
  <text x="332" y="183" fill="#FFFFFF" font-family="sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">3. Titanium Post</text>
</svg>
