<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Tooth Filling &amp; Cavity Restoration Diagram">
  <defs>
    <linearGradient id="bgFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="12" fill="url(#bgFill)"/>
  
  <!-- Gum line -->
  <path d="M40,165 Q120,180 200,170 T360,175 L360,285 L40,285 Z" fill="#FCE7F3"/>
  
  <!-- Molar tooth -->
  <path d="M120,80 C120,55 150,45 200,45 C250,45 280,55 280,80 C285,130 290,190 275,245 C265,265 240,265 230,245 C215,190 185,190 170,245 C160,265 135,265 125,245 C110,190 115,130 120,80 Z" 
        fill="#FFFFFF" stroke="#0B2545" stroke-width="3.5"/>
  
  <!-- Natural Pulp & Nerve inside (Healthy) -->
  <path d="M175,130 C175,120 185,115 200,115 C215,115 225,120 225,130 C225,150 230,190 235,230 C230,235 225,230 222,225 C215,180 210,160 200,160 C190,160 185,180 178,225 C175,230 170,235 165,230 C170,190 175,150 175,130 Z" 
        fill="#FDA4AF"/>
  
  <!-- Composite Tooth Filling Restoration (Seamless bonding) -->
  <path d="M165,48 C180,68 220,68 235,48 C225,46 212,45 200,45 C188,45 175,46 165,48 Z" 
        fill="#E2E8F0" stroke="#0284C7" stroke-width="2"/>
  <path d="M170,52 C185,75 215,75 230,52" fill="#BAE6FD"/>
  
  <!-- Blue Curing Light wavelength representation -->
  <g transform="translate(145, 10)">
    <polygon points="55,0 40,35 70,35" fill="#38BDF8" opacity="0.45"/>
    <circle cx="55" cy="0" r="10" fill="#0284C7"/>
    <text x="55" y="-12" fill="#0284C7" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">UV Curing Light</text>
  </g>
  
  <!-- Callouts -->
  <line x1="230" y1="65" x2="280" y2="65" stroke="#FF7A00" stroke-width="1.5"/>
  <rect x="280" y="50" width="105" height="28" rx="4" fill="#FF7A00"/>
  <text x="332" y="68" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">Composite Resin</text>

  <g transform="translate(100, 260)">
    <rect width="200" height="28" rx="6" fill="#0B2545"/>
    <text x="100" y="18" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Natural-Shade Cavity Seal</text>
  </g>
</svg>
