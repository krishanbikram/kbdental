<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Teeth Cleaning and Scaling Diagram">
  <defs>
    <linearGradient id="bgClean" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="12" fill="url(#bgClean)"/>
  
  <!-- Healthy Pink Gums -->
  <path d="M40,160 Q120,140 200,145 T360,160 L360,280 L40,280 Z" fill="#FCE7F3"/>
  <path d="M40,160 Q120,140 200,145 T360,160" fill="none" stroke="#F472B6" stroke-width="3"/>
  
  <!-- Central Tooth -->
  <path d="M130,80 C130,50 160,40 200,40 C240,40 270,50 270,80 C275,120 280,180 270,240 C260,260 230,260 220,240 C210,180 190,180 180,240 C170,260 140,260 130,240 C120,180 125,120 130,80 Z" 
        fill="#FFFFFF" stroke="#0B2545" stroke-width="3.5"/>
  
  <!-- Tartar / Calculus build-up being eliminated (Before/After side) -->
  <!-- Left Side: Plaque/Calculus -->
  <path d="M128,142 Q145,155 145,170 Q130,175 124,158 Z" fill="#D97706"/>
  <text x="50" y="155" font-family="sans-serif" font-size="11" font-weight="700" fill="#B45309">Tartar &amp; Stains</text>
  <line x1="105" y1="155" x2="124" y2="155" stroke="#B45309" stroke-width="1.5" stroke-dasharray="3 2"/>

  <!-- Right Side: Ultrasonic Scaler Tip emitting water spray & vibration -->
  <g transform="translate(250, 125)">
    <!-- Scaler instrument tip -->
    <path d="M70,30 L15,15 L0,20 L15,25 Z" fill="#64748B" stroke="#0B2545" stroke-width="1.5"/>
    <rect x="70" y="24" width="60" height="12" rx="3" fill="#0B2545"/>
    <!-- Vibrating sound waves / water cooling spray -->
    <circle cx="-5" cy="18" r="4" fill="#38BDF8" opacity="0.8"/>
    <circle cx="-12" cy="10" r="3" fill="#38BDF8" opacity="0.6"/>
    <circle cx="-10" cy="28" r="3.5" fill="#38BDF8" opacity="0.7"/>
    <path d="M-8,5 Q-16,18 -8,30" fill="none" stroke="#0284C7" stroke-width="2"/>
  </g>
  <text x="250" y="200" font-family="sans-serif" font-size="11" font-weight="700" fill="#0369A1">Ultrasonic Vibration &amp; Irrigation</text>
  
  <!-- Sparkles on clean polished enamel -->
  <path d="M190,60 L193,52 L196,60 L204,63 L196,66 L193,74 L190,66 L182,63 Z" fill="#FF7A00"/>
  <path d="M225,85 L227,78 L229,85 L236,87 L229,89 L227,96 L225,89 L218,87 Z" fill="#38BDF8"/>
  
  <g transform="translate(100, 260)">
    <rect width="200" height="28" rx="6" fill="#0B2545"/>
    <text x="100" y="18" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Enamel-Safe Plaque &amp; Calculus Removal</text>
  </g>
</svg>
