<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" width="320" height="72" role="img" aria-label="KB Dental Logo">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2545"/>
      <stop offset="100%" stop-color="#133E87"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#FF9E40"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0B2545" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Tooth Emblem with Care Arc -->
  <g transform="translate(10, 8)" filter="url(#softShadow)">
    <!-- Base Tooth Shape -->
    <path d="M28,6 C38,6 48,13 48,26 C48,37 42,46 36,54 C33,58 30,58 28,52 C26,45 23,45 21,52 C19,58 16,58 13,54 C7,46 1,37 1,26 C1,13 11,6 21,6 C23.5,6 25.8,7.2 28,9.5 C30.2,7.2 32.5,6 28,6 Z" 
          fill="url(#blueGrad)" />
    <!-- Dynamic Care Arc / Smile Line -->
    <path d="M10,24 C18,34 31,34 39,24" 
          fill="none" stroke="url(#orangeGrad)" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Sparkle / Modern Accent -->
    <path d="M44,10 L46,5 L48,10 L53,12 L48,14 L46,19 L44,14 L39,12 Z" 
          fill="#FF7A00"/>
  </g>
  
  <!-- Brand Text -->
  <g transform="translate(74, 16)">
    <text x="0" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#0B2545" letter-spacing="-0.5">KB<tspan fill="#FF7A00">DENTAL</tspan></text>
    <text x="1" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#64748B" letter-spacing="1.2">KATHMANDU DENTAL REFERRAL NETWORK</text>
  </g>
</svg>
